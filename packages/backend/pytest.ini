[pytest]
testpaths = tests
pythonpath = . tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Deprecations are errors so they get fixed rather than accumulating.
# The SECRET_KEY notice is aimed at someone starting a server, not the suite,
# which deliberately runs on the development default.
filterwarnings =
    error::DeprecationWarning
    ignore:SECRET_KEY is the insecure default.*:UserWarning
