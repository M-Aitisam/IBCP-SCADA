# .github/workflows/ml-training.yml
#
# Weekly drought-model retraining.
#
# Runs the ml-pipeline scripts end to end (extract -> feature engineer ->
# train -> evaluate) against the same Postgres database the backend ingests
# into, then commits the refreshed model artifact. Committing the artifact
# (rather than uploading it as a build-only Actions artifact) is deliberate:
# the backend serves it straight off disk at
# packages/ml-pipeline/models/trained/, and Vercel builds from the repo, not
# from an Actions run — an artifact the deploy can't see is useless to it.
#
# Dispatched manually via POST /api/v1/ml/retrain (see
# app/services/ml/retrain_control.py) or on the weekly schedule below.

name: ML model retraining

on:
  schedule:
    # 04:00 UTC every Monday — after the nightly GEE ingestion + analytics
    # cascade has had all week to accumulate fresh observations and hazard
    # scores, which this pipeline trains on.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ml-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: packages/ml-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/ml-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract training data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/extract_training_data.py --years-back 2

      - name: Feature engineering
        run: python scripts/feature_engineering.py

      - name: Train XGBoost
        run: python scripts/train_xgboost.py --version v1

      - name: Evaluate model
        run: python scripts/evaluate_model.py

      - name: Check target metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path("models/trained/drought_xgboost_v1.json").read_text())
          f1, r2 = meta["f1_score"], meta["r2_score"]
          print(f"F1 (macro) = {f1:.4f}, R2 (ordinal) = {r2:.4f}")
          if not meta["meets_target"]:
              print("::warning::Model does not meet F1>=0.70 and R2>=0.70 — "
                    "committing anyway for visibility, but review before relying on it.")
          PY

      - name: Commit updated model artifact
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/trained/drought_xgboost_v1.pkl models/trained/drought_xgboost_v1.json
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "chore(ml): retrain drought model $(date -u +%F)"
            git push
          fi

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ml-evaluation-report
          path: packages/ml-pipeline/Data/evaluation/
          retention-days: 90
