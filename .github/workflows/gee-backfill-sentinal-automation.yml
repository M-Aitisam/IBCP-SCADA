name: GEE Sentinel-1 & Sentinel-2 Automated Pipeline

on:
  # Run automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive start date (YYYY-MM-DD)"
        required: false
        type: string

      end_date:
        description: "Inclusive end date (YYYY-MM-DD)"
        required: false
        type: string

      datasets:
        description: "Comma-separated datasets: sentinel1_vv,sentinel1_vh,sentinel2_ndvi,sentinel2_ndmi"
        required: false
        type: string

      mode:
        description: "Pipeline mode"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - backfill

      force:
        description: "Force reprocessing of already-ingested data"
        required: false
        default: false
        type: boolean

concurrency:
  group: gee-sentinel-pipeline
  cancel-in-progress: false

jobs:

  # ============================================================
  # SENTINEL-1
  # ============================================================

  sentinel1:
    name: Sentinel-1 GEE Ingestion

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        dataset:
          - sentinel1_vv
          - sentinel1_vh

    defaults:
      run:
        working-directory: packages/backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head

      - name: Run Sentinel-1 ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_PRIVATE_KEY: ${{ secrets.GEE_PRIVATE_KEY_BASE64 }}

          GEE_ROI_GEOJSON_PATH: ${{ vars.GEE_ROI_GEOJSON_PATH }}
          GEE_ROI_PROVINCES: ${{ vars.GEE_ROI_PROVINCES }}

          GEE_S1_COLLECTION: "COPERNICUS/S1_GRD"

          BACKFILL_START_DATE: ${{ inputs.start_date || vars.GEE_HISTORICAL_START || '2016-01-01' }}
          BACKFILL_END_DATE: ${{ inputs.end_date || vars.GEE_TARGET_END }}

          BACKFILL_DATASETS: ${{ inputs.datasets || matrix.dataset }}

          INGESTION_MODE: ${{ inputs.mode || 'incremental' }}

          FORCE_REPROCESS: ${{ inputs.force || 'false' }}

        run: |
          echo "=========================================="
          echo "Sentinel-1 GEE Ingestion"
          echo "Dataset: ${BACKFILL_DATASETS}"
          echo "Collection: ${GEE_S1_COLLECTION}"
          echo "Mode: ${INGESTION_MODE}"
          echo "=========================================="

          python -m app.ingestion.cli ingest \
            --dataset "${BACKFILL_DATASETS}" \
            --start-date "${BACKFILL_START_DATE}" \
            --end-date "${BACKFILL_END_DATE}" \
            --mode "${INGESTION_MODE}" \
            $([ "${FORCE_REPROCESS}" = "true" ] && echo "--force")

      - name: Sentinel-1 status
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.ingestion.cli status \
            --dataset "${{ matrix.dataset }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # SENTINEL-2
  # ============================================================

  sentinel2:
    name: Sentinel-2 GEE Ingestion

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        dataset:
          - sentinel2_ndvi
          - sentinel2_ndmi

    defaults:
      run:
        working-directory: packages/backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head

      - name: Run Sentinel-2 ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_PRIVATE_KEY: ${{ secrets.GEE_PRIVATE_KEY_BASE64 }}

          GEE_ROI_GEOJSON_PATH: ${{ vars.GEE_ROI_GEOJSON_PATH }}
          GEE_ROI_PROVINCES: ${{ vars.GEE_ROI_PROVINCES }}

          GEE_S2_COLLECTION: "COPERNICUS/S2_SR_HARMONIZED"

          BACKFILL_START_DATE: ${{ inputs.start_date || vars.GEE_HISTORICAL_START || '2016-01-01' }}
          BACKFILL_END_DATE: ${{ inputs.end_date || vars.GEE_TARGET_END }}

          BACKFILL_DATASETS: ${{ inputs.datasets || matrix.dataset }}

          INGESTION_MODE: ${{ inputs.mode || 'incremental' }}

          FORCE_REPROCESS: ${{ inputs.force || 'false' }}

        run: |
          echo "=========================================="
          echo "Sentinel-2 GEE Ingestion"
          echo "Dataset: ${BACKFILL_DATASETS}"
          echo "Collection: ${GEE_S2_COLLECTION}"
          echo "Mode: ${INGESTION_MODE}"
          echo "=========================================="

          python -m app.ingestion.cli ingest \
            --dataset "${BACKFILL_DATASETS}" \
            --start-date "${BACKFILL_START_DATE}" \
            --end-date "${BACKFILL_END_DATE}" \
            --mode "${INGESTION_MODE}" \
            $([ "${FORCE_REPROCESS}" = "true" ] && echo "--force")

      - name: Sentinel-2 status
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.ingestion.cli status \
            --dataset "${{ matrix.dataset }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # FINAL VALIDATION
  # ============================================================

  pipeline-validation:
    name: Validate Sentinel Pipeline

    runs-on: ubuntu-latest

    needs:
      - sentinel1
      - sentinel2

    if: always()

    defaults:
      run:
        working-directory: packages/backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate ingestion status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=========================================="
          echo "FINAL GEE SENTINEL PIPELINE STATUS"
          echo "=========================================="

          python -m app.ingestion.cli backfill-status \
            | tee "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Sentinel-1 and Sentinel-2 ingestion completed."
